<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpeta Manila</title>
<meta name="description" content="A growing collection of open access templates & resources.">
<link rel="stylesheet" href="styles.css">

<body>
<div id="stage">

  <nav id="menu" aria-label="Main">

<script src="templates.js"></script>
