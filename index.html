<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carpeta Manila</title>
<meta name="description" content="A growing collection of open access templates & resources.">
<link rel="stylesheet" href="styles.css">
<style id="tplcss"></style>
</head>
<body>
<div id="stage">
  <main id="rail" aria-label="Templates by category"></main>

  <svg class="spine" width="70.017" height="1004.61" viewBox="0 0 70.017 1004.61" fill="none" aria-hidden="true">
    <path d="M69.5 0V311C69.5 316 67 321 62.5 323.5L7.5 345C3 347.5 .5 352 .5 357V590C.5 595 3 600 7.5 602.5L62.5 624C67 626.5 69.5 631 69.5 636V1004.61" stroke="currentColor"/>
  </svg>
  <h1 class="ttl"><img src="assets/logo.svg" alt="Carpeta Manila"></h1>
  <p class="tag">A growing collection of open access templates &amp; resources.</p>

  <nav id="menu" aria-label="Main">
    <button class="ml" id="mbtn" aria-expanded="false" aria-controls="mi">Index</button>
    <div id="mi">
      <button data-panel="info">Info</button>
      <button data-panel="team">Team</button>
      <button data-panel="contact">Contact</button>
    </div>
  </nav>

  <aside class="strip">
    <h1 class="mt"><img src="assets/logo.svg" alt="Carpeta Manila"></h1>
    <button id="mmb" data-panel="menu">— Index</button>
  </aside>

  <div class="sheet" id="sheet" aria-hidden="true"><div class="blank" id="blank"></div></div>
  <div class="panel" id="panel" hidden role="dialog" aria-modal="true"></div>
  <div class="card" id="card" hidden role="dialog" aria-label="Retrieval slip"></div>
</div>
<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
